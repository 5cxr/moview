spring.application.name=moview-backend

# MySQL - create the DB first: CREATE DATABASE moview;
# override DB_PORT if your local MySQL runs on a non-default port
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/moview?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT - override JWT_SECRET in real env, this default is only for local dev
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
